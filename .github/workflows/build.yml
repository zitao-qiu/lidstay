name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: swift --version

      - name: Typecheck
        run: make lint

      - name: Build bundle
        run: make build

      - name: Smoke test the CLI entry point
        run: |
          ./build/LidStay.app/Contents/MacOS/LidStay --status
          plutil -lint build/LidStay.app/Contents/Info.plist
